<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу Никиты и Анастасии</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f0f6f9; color: #1d1d1f; padding: 20px 16px; min-height: 100vh; }
        .bg-blur-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .blur-wine { position: absolute; width: 450px; height: 450px; border-radius: 50%; background: #58111A; opacity: 0.15; filter: blur(80px); top: -100px; left: -100px; }
        .blur-blue { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: #87CEEB; opacity: 0.2; filter: blur(90px); bottom: -100px; right: -100px; }
        .wrapper { max-width: 420px; margin: 0 auto; }
        .card { background: #ffffff; border-radius: 24px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { font-size: 1.6rem; margin-bottom: 15px; }
        p { font-size: 0.95rem; line-height: 1.5; color: #515154; margin-bottom: 15px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 15px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.1); font-size: 1rem; }
        .btn-submit { width: 100%; background: #58111A; color: #fff; padding: 16px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-submit:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="bg-blur-container">
    <div class="blur-wine"></div>
    <div class="blur-blue"></div>
</div>

<div class="wrapper">
    <div class="card">
        <h1>Никита & Анастасия</h1>
        <p>Мы будем рады разделить с вами этот особенный день!</p>
        
        <form action="https://formspree.io/f/meedpbyy" method="POST">
            <div class="form-group">
                <label>Имя и Фамилия:</label>
                <input type="text" name="Имя_Гостя" placeholder="Иван Иванов" required>
            </div>
            <div class="form-group">
                <label>Сможете присутствовать?</label>
                <select name="Присутствие">
                    <option value="Да, с удовольствием!">Да, с удовольствием!</option>
                    <option value="К сожалению, не смогу">К сожалению, не смогу</option>
                </select>
            </div>
            <div class="form-group">
                <label>Сколько человек?</label>
                <input type="number" name="Количество_человек" value="1" min="1" max="10">
            </div>
            <button type="submit" class="btn-submit">Отправить ответ</button>
        </form>
    </div>
</div>

</body>
</html>
